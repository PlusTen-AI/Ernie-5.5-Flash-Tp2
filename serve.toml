# serve.toml — every setting of the server, with its default. Do not edit this file for your machines: copy
# serve.local.toml.example to serve.local.toml (not tracked by git) and set what differs there.
# Precedence: command line (--set section.key=value) > environment (E55_<SECTION>_<KEY>) > serve.local.toml > this file.

[cluster]
# The worker node (rank 1) as `ssh` reaches it from the head node: "user@host" or a name from ~/.ssh/config. Required.
worker = ""
# The worker's address(es) on the direct CX7 link. Empty = the host part of `worker` (which must then be a CX7 address).
# One address is enough: the other half of the same CX7 port (each GB10 CX7 port shows up as two RDMA devices) is
# found on both nodes at every start and used as a second rail. List one address per rail to choose them yourself.
worker_addr = []
# Rails: 0 = all that were found (the routed device and its sibling), 1 = only the routed device.
rails = 0
# RoCE v2 GID index for NCCL; -1 = read from the device at every start (the RoCE v2 entry holding its IPv4 address).
gid_index = -1
# TCP ports on the CX7 addresses: NCCL bootstrap on the head (the RDMA all-reduce uses nccl_port + 1) and the command
# link on the worker.
nccl_port = 29611
link_port = 29650

[paths]
# The checkpoint folder (baidu/ERNIE-5.5-Flash-Preview: config.json, tokenizer.json, model.safetensors.index.json and
# the 128 shards model-000NN-of-00128.safetensors, ~154 GiB), the same path on both nodes. Required.
weights = ""
# Where ./start.sh download gets the checkpoint: Hugging Face repo and commit (a prefix of the commit hash is enough).
# Only the prefix de3ffd3e is recorded (the full hash is not known here); the download finds the commit it starts and
# prints its full hash.
weights_repo = "baidu/ERNIE-5.5-Flash-Preview"
weights_revision = "de3ffd3e"
# Build cache, logs and the tensor table; the same path on both nodes. Relative paths are inside the repo.
work = ".work"
# The repo on the worker; empty = the same path as on the head. ./start.sh copies the head's repo there.
worker_repo = ""
# Docker image name; the tag comes from docker/Dockerfile (a changed file is a new tag).
image = "ernie55-plus"

[server]
served_name = "baidu/ERNIE-5.5-Flash"
host = "0.0.0.0"
port = 8888
# Requests served at the same time (1 … 16): every DSpark round verifies all decoding ones in one target step (up to
# block + 1 rows each) and drafts them in one pass, so the round's rows grow with them, not its count. The engine keeps
# max(slots × (block + 1), decode.copy_rows) logit rows. Fixed memory per node beside the KV pool (each running
# request's caches come from the pool as it grows): ~40 MB a slot (HCA windows and compressor states 22, the draft's
# q rows 13, its context rows 5) + ~3.2 MB a logit row — 4 slots ~0.36 GB, 8 ~0.52 GB (+0.15 GiB), 16 ~1.05 GB
# (+0.64 GiB) (estimate from the engine's buffer sizes). decode.verify "cost"'s round table is measured at 1 / 4 / 8 / 16
# sequences, and verify steps are checked bitwise up to 128 rows (16 slots). More requests than slots wait for one.
slots = 4
# Tokens per request at most (prompt + output), up to 1,048,576 (the model's limit). With the KV pool (patches.kv_pool,
# on by default) this costs no memory up front: the caches come from the pool as a request grows (~4.4 KiB a token on
# each node), and the HTTP front's max_model_len is this or what the whole pool holds, whichever is less. Without the
# pool every slot gets the caches for this many at start.
context = 1048576
# Reply tokens (thinking + answer) of a request that sends no max_tokens / max_completion_tokens; 0 = all the room
# left in the context. A request's own value wins (cut to the room as vLLM does).
max_tokens = 131072
chunk = 8192            # prompt rows per prefill step (8192: the experts read once per 8192 rows — measured 1,304 vs 1,398 ms per 4096 rows)
# Prompt rows a prefill step reads while other requests are decoding (0 = chunk): a new prompt's chunk is then read in
# pieces of this many rows (≥ 512; the chunk's rest ≥ 512) with a decode round between two, so the running replies
# wait one piece (~0.32 ms a row) instead of a whole chunk (8192 rows ~2.6 s). The same output (every kernel is
# batch-invariant: a row gets the same bits in any piece; checkpoints stay at the chunks' ends); the prompt takes
# longer (smaller steps read the experts more often: +7 % at 4096 by the measurement above, more below it) and the
# replies' total wait stays about the same, so 0 is the most throughput; set it for smoother streams.
decode_chunk = 0
# KV pool: after a warm-up of the serving paths at start, the pool takes all the memory left on the node with less of
# it, less memory_free_gib (kept free for the system; GB10's CUDA allocates from free pages, so MemFree counts, not the
# page cache), at most kv_pool_gib (0 = no cap); both nodes take the same. A request is placed when the pool holds its
# prompt + min(max_tokens, output_reserve) beside the running requests' reservations (idle slots give theirs back
# first), else it waits; a longer reply takes more as it goes and ends with finish "length" only when the pool is full.
# A prompt no pool could hold is refused (400). Without the pool: start refuses slots × context when their caches do not
# fit in what is left after the weights and workspaces, less memory_free_gib.
memory_free_gib = 15
kv_pool_gib = 0
output_reserve = 32768
# Both nodes' MemFree is read every 5 s; while either is below this, new requests wait (one [mem] line; /health says
# "low memory"); running ones go on.
memory_floor_gib = 4
# Prefix checkpoints (patches.prefix_ckpt, needs the KV pool): a prompt that leaves a slot's history part-way (the
# client did not send the last reply's reasoning back, an agent rewrote an earlier message) restores the slot's longest
# checkpoint at or below the common prefix and reads only the rest, instead of reading from 0 — the same output. A
# slot takes one at every prompt's end and after a prefill chunk checkpoint_every tokens past its last one, at most
# `checkpoints` (then the one adding the fewest tokens over the one below it goes); each 2.9–21 MiB of the KV pool,
# taken only when the pool has it beyond the running requests' reservations. 0 = none (every such prompt reads from 0).
checkpoints = 8
checkpoint_every = 8192
# Measurement: wait for every prefill chunk and log one [prefill] line a request — the time to first token a cold
# prompt of 8K / 32K / 128K / 256K / 512K / its own length would take (one long read gives the whole curve).
# Costs a sync a chunk; off for serving.
prefill_marks = false
drain_seconds = 30      # ./stop.sh: how long running requests get to finish
# Special-token text a client wrote (any added token's text, in every message incl. system, reasoning, tool-call
# arguments and tool definitions) is encoded as ordinary text, so only the chat template's own markers are control
# tokens (a plain tokenizer would turn a written "<|ernie:im_end|>" into the real token). Prompts without such text:
# same tokens.
plain_specials = true
start_timeout = 900     # ./start.sh: seconds to wait until both ranks are ready
# Optional API key: clients then send "Authorization: Bearer <key>" for /v1/*. Put it in serve.local.toml or the
# environment (E55_SERVER_API_KEY), not on a command line.
api_key = ""

[decode]
# DSpark speculative decoding with the checkpoint's bundled draft (model.mtp.*): every round the draft proposes up to
# `block` tokens for each decoding sequence, one target step verifies them for all of them, and each sequence emits the
# tokens the target accepts plus the target's own next one. Lossless: greedy requests get plain decoding's tokens, sampled
# ones the same distribution (speculative acceptance with the request's sampling settings, penalties and seed).
# false = plain decoding (one token a sequence and step; the draft is not loaded).
dspark = true
block = 7               # draft tokens per round, 1 … 15 (the engine keeps slots × (block + 1) logit rows)
# How many drafts a round verifies (only that changes; lossless either way):
#   "cost" (P143): for all decoding sequences together, the counts with the most expected tokens (from the draft's
#          confidence head) per ms of the round — its measured cost by sequences and verify rows (server/scheduler.py)
#   "gate" (P121): each sequence's drafts while the product of their confidences (σ of the confidence head) stays
#          ≥ gate; gate 0 = every draft
verify = "cost"
gate = 0.3
# Copy drafts (patches.copy_draft, with dspark): while one request decodes alone and its reply repeats text its history
# already holds (a file rewritten with an edit, code echoed back, a tool call quoting earlier text), the tokens that
# followed that text there are verified in place of the draft's — each verify row drawn as plain decoding draws it, so
# the reply is the one it gets without copying; a wrong copy only costs rows. Rounds shared by several requests are
# never copy rounds. false = DSpark rounds only.
copy = true
copy_rows = 64          # verify rows of a copy round at most (2 … 64; the engine keeps max(slots × (block + 1), this) logit rows: free from 8 slots up)
copy_match = 8          # tokens the reply's tail must repeat before a copy is offered (each copy not taken whole doubles it, up to 8×)

[thinking]
# Reasoning efforts are the chat template's: low, medium, high (high when the request names none);
# chat_template_kwargs {"enable_thinking": false} turns thinking off.
# Thinking-token budget per effort level (0 = no budget). When a reply's thinking reaches it, the server closes the
# thinking (</ernie:think>) and the model answers. A request's `thinking_budget` overrides it.
budget_low = 0
budget_medium = 0
budget_high = 0
# A thinking loop (the last 256 thinking tokens repeat a pattern of at most 8 tokens) is closed the same way, once per
# reply.
loop_guard = true

[patches]
# Engine patches by name (engine/src/model/patches.def), true or false. Not listed = the default there.
